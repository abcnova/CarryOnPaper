  # Restore core mob data when possible.
  # Villager and Wandering Trader trades are saved with Bukkit MerchantRecipe data.
  preserve-basic-data: true

# The checker makes a small public Modrinth API request at startup and every 12 hours.
# It sends no player, server, address, or configuration data; only OPs and the console are notified.
update-checker:
  enabled: true
